# Run suite of CI builds and tests in a RHEL8 container
name: "CI [RHEL8]"

on:
  push:
    branches: [ devel, "release/**" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ devel, "release/**" ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/actions/spelling/**'
      - '.github/ISSUE_TEMPLATE/**'

# Cancel in-progress runs if a newer run is started on a given PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !contains(github.ref, 'devel') && !contains(github.ref, 'release/')}}

jobs:
  Framework:
    runs-on: ubuntu-latest
    container:
      image: redhat/ubi8:8.10
    steps:
    - name: "Install dependencies"
      run: |
        dnf install -y git python3.12 python3.12-pip llvm-toolset libasan libubsan java-1.8.0-openjdk
        git config --global --add safe.directory ${GITHUB_WORKSPACE}
    - name: "Checkout F´ Repository"
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: true
    - uses: ./.github/actions/setup
    - name: Build Framework
      run: |
        fprime-util generate -DFPRIME_ENABLE_JSON_MODEL_GENERATION=ON
        fprime-util build --all -j4

  Ref:
    runs-on: ubuntu-latest
    container:
      image: redhat/ubi8:8.10
    steps:
    - name: "Install dependencies"
      run: |
        dnf install -y git python3.12 python3.12-pip llvm-toolset libasan libubsan java-1.8.0-openjdk
        git config --global --add safe.directory ${GITHUB_WORKSPACE}
    - name: "Checkout F´ Repository"
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: true
    - uses: ./.github/actions/setup
    - name: Build Ref
      run: |
        cd Ref
        fprime-util generate -DFPRIME_ENABLE_JSON_MODEL_GENERATION=ON
        fprime-util build -j4

  UTs:
    runs-on: ubuntu-latest
    container:
      image: redhat/ubi8:8.10
    steps:
      - name: "Install dependencies"
        run: |
          dnf install -y git python3.12 python3.12-pip llvm-toolset libasan libubsan java-1.11.0-openjdk unzip
          git config --global --add safe.directory ${GITHUB_WORKSPACE}

      - name: "Checkout F´ Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - uses: ./.github/actions/setup

      - name: Build Framework and Generate Json
        run: |
          fprime-util generate
          # Listamos directorios para depurar si algo sale mal
          echo "Directorios creados:"
          ls -d build-fprime-* || echo "No se encontraron carpetas build-fprime-*"
          
          # Buscamos el archivo compile_commands.json en CUALQUIER subcarpeta de build
          # y lo traemos a la raíz.
          find . -name "compile_commands.json" -exec cp {} . \;
          
          # Verificamos si el archivo realmente se copió
          if [ -f "compile_commands.json" ]; then
            echo "✅ compile_commands.json encontrado y copiado."
          else
            echo "❌ ERROR: No se encontró compile_commands.json"
            exit 1
          fi

      - name: "Run SonarCloud Scanner"
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          # Instalamos Java 17 (Requerido por los scanners modernos) y unzip
          dnf install -y java-17-openjdk unzip curl
          
          # Descargar y ejecutar el scanner
          curl -sSLo /tmp/sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip
          unzip -o /tmp/sonar-scanner.zip -d /opt/
          
          # Ejecutar scanner con configuración desde sonar-project.properties
          /opt/sonar-scanner-5.0.1.3006-linux/bin/sonar-scanner