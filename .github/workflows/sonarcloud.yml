# Run suite of CI builds and tests in a RHEL8 container
name: "CI [RHEL8]"

on:
  push:
    branches: [ devel, "release/**" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ devel, "release/**" ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/actions/spelling/**'
      - '.github/ISSUE_TEMPLATE/**'

# Cancel in-progress runs if a newer run is started on a given PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !contains(github.ref, 'devel') && !contains(github.ref, 'release/')}}

jobs:
  Framework:
    runs-on: ubuntu-latest
    container:
      image: redhat/ubi8:8.10
    steps:
    - name: "Install dependencies"
      run: |
        dnf install -y git python3.12 python3.12-pip llvm-toolset libasan libubsan java-1.8.0-openjdk
        git config --global --add safe.directory ${GITHUB_WORKSPACE}
    - name: "Checkout F´ Repository"
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: true
    - uses: ./.github/actions/setup
    - name: Build Framework
      run: |
        fprime-util generate -DFPRIME_ENABLE_JSON_MODEL_GENERATION=ON
        fprime-util build --all -j4

  Ref:
    runs-on: ubuntu-latest
    container:
      image: redhat/ubi8:8.10
    steps:
    - name: "Install dependencies"
      run: |
        dnf install -y git python3.12 python3.12-pip llvm-toolset libasan libubsan java-1.8.0-openjdk
        git config --global --add safe.directory ${GITHUB_WORKSPACE}
    - name: "Checkout F´ Repository"
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: true
    - uses: ./.github/actions/setup
    - name: Build Ref
      run: |
        cd Ref
        fprime-util generate -DFPRIME_ENABLE_JSON_MODEL_GENERATION=ON
        fprime-util build -j4

  UTs:
    runs-on: ubuntu-latest
    container:
      image: redhat/ubi8:8.10
    steps:
    - name: "Install dependencies"
      run: |
        dnf install -y git python3.12 python3.12-pip llvm-toolset libasan libubsan java-1.8.0-openjdk
        git config --global --add safe.directory ${GITHUB_WORKSPACE}
        
    - name: "Checkout F´ Repository"
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: true

    - uses: ./.github/actions/setup

    - name: "Generate Compile Commands"
      # Es vital generar esto para que Sonar entienda el C++
      run: |
        fprime-util generate
        # Movemos o aseguramos la ruta del compile_commands para Sonar
        mkdir -p build-artifacts
        cp build-fprime-automatic-default/compile_commands.json build-artifacts/compile_commands.json

    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@v2
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        # Simplificamos los args. Sonar leerá el sonar-project.properties por defecto.
        # Solo pasamos variables dinámicas si es estrictamente necesario.
        args: >
          -Dsonar.scm.revision=${{ github.event.pull_request.head.sha || github.sha }}