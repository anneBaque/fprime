name: SonarCloud Analysis

on:
  push:
    branches: [ "main", "release/v4.2.x" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Requerido para un análisis preciso de SonarCloud

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Set up Java (required for SonarCloud)
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install build tools and gcovr
        run: |
          sudo apt update
          sudo apt install -y build-essential cmake ninja-build
          pip install --upgrade pip
          pip install fprime-tools gcovr
          # Instalamos dependencias del repositorio de F'
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Initialize submodules
        run: git submodule update --init --recursive # Vital para que existan los frameworks de test

      - name: Build project with Coverage (F Prime)
        run: |
          # Generamos con flags de Unit Test para habilitar la cobertura
          fprime-util generate --ut
          fprime-util build --ut

      - name: Run Tests and Generate Evidence
        run: |
          export GTEST_OUTPUT="xml:test_results.xml"
          # Ejecutamos los tests (esto genera los archivos .gcda en la carpeta build-*)
          fprime-util check || echo "Tests finalizados"
          
          # COMANDOS CORREGIDOS:
          # 1. Instalamos gcovr si no estaba (por seguridad)
          pip install gcovr
          
          # 2. Generamos el XML buscando en toda la raíz y forzando rutas relativas
          # El flag -f asegura que solo se incluya código del framework, no de los tests
          gcovr -r . \
            --sonarqube coverage.xml \
            --gcov-ignore-parse-errors=negative_hits.warn \
            --filter Fw/ --filter Os/ --filter Svc/ \
            --print-summary

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Pasamos los archivos generados como argumentos para visibilidad en el dashboard[cite: 1]
          args: >
            -Dsonar.cfamily.gcov.reportsPath=coverage.xml
            -Dsonar.junit.reportPaths=test_results.xml