# Información del proyecto
sonar.projectKey=anneBaque_fprime
sonar.organization=anneBaque

# Nombre y versión del proyecto
sonar.projectName=F Prime Core Analysis
sonar.projectVersion=1.0

# Solo analizar estas carpetas específicas
sonar.sources=Fw/,Os/,Svc/,Utils/

# Tipos de archivo a incluir (C/C++)
sonar.inclusions=**/*.cpp,**/*.hpp,**/*.c,**/*.h

# Exclusiones dentro de esas carpetas (si hay algo que no quieres)
sonar.exclusions=\
  **/build/**,\
  **/build-*/**,\
  **/test/**,\
  **/tests/**,\
  **/*Test.cpp,\
  **/*Test.hpp

# Encoding
sonar.sourceEncoding=UTF-8

# Excluir archivos generados automáticamente
sonar.cpd.exclusions=**/Ac/**,**/*Ac.cpp,**/*Ac.hpp

# Excluir de cobertura
sonar.coverage.exclusions=**/test/**,**/*Test.cpp

sonar.python.version=3.8,3.9,3.10,3.11

# Configuración para C/C++ - usar compilation database
sonar.cfamily.compile-commands=build/compile_commands.json

# Excluir archivos generados automáticamente
sonar.cpd.exclusions=**/Ac/**,**/*Ac.cpp,**/*Ac.hpp

# Excluir de cobertura
sonar.coverage.exclusions=**/test/**,**/*Test.cpp