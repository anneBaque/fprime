# Información del proyecto
sonar.projectKey=anneBaque_fprime
sonar.organization=anneBaque
sonar.projectName=F Prime Core Analysis
sonar.projectVersion=1.0

# --- CONFIGURACIÓN DE ALCANCE (SCOPE) ---
# Definimos que la raíz del análisis es SOLO Fw
sonar.sources=Fw
# Incluimos todo lo que esté dentro de Fw de forma recursiva
sonar.inclusions=**/*

# Exclusiones refinadas
sonar.exclusions=\
  **/build/**,\
  **/build-*/**,\
  **/test/**,\
  **/tests/**,\
  **/*Test.cpp,\
  **/*Test.hpp,\
  Fw/Test/**,\
  **/docs/**

# Excluir archivos generados por F' (Autocoded)
sonar.cpd.exclusions=**/Ac/**,**/*Ac.cpp,**/*Ac.hpp
sonar.coverage.exclusions=**/test/**,**/*Test.cpp,**/Ac/**,**/*Ac.cpp,**/*Ac.hpp

# --- CONFIGURACIÓN TÉCNICA ---
sonar.sourceEncoding=UTF-8
sonar.language=cpp
# Ruta relativa al comando de ejecución (ajustada para el build de F')
sonar.cfamily.compile-commands=build-artifacts/compile_commands.json

sonar.python.version=3.8,3.9,3.10,3.11